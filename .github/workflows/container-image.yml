name: Container Image

# Publishes the same OCI images `nix build .#oci-image`/`.#oci-image-press`/`.#oci-image-rust`
# produce (specs 005/020/025/027/029, Constitution Principle IV: container parity, not a
# hand-maintained Dockerfile) to the GitHub Container Registry, so anyone - a human testing a
# change, or an AI agent spinning up a disposable sandbox - can `docker pull` this repository's
# exact closure instead of building it from source. Three images (base+fish, base+fish+press, and
# base+fish+rust), each for linux/amd64 and linux/arm64 - see
# specs/020-public-container-image/spec.md, specs/027-dual-image-multiarch-publish/spec.md, and
# specs/029-rust-toolchain-persona-image/spec.md.

on:
  push:
    branches: [main]
    paths:
      - "home/**"
      - "pkgs/**"
      - "oci/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/container-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image
  cancel-in-progress: false

jobs:
  # Six build legs (3 images x 2 architectures). `ubuntu-24.04-arm` is a
  # free, GA, GitHub-hosted arm64 runner for public repositories (no
  # cross-compilation or QEMU emulation) - `nix build .#<attr>` on it
  # resolves `packages.aarch64-linux.<attr>` automatically (the Nix CLI
  # infers `system` from the runner's own architecture). Each leg pushes
  # its own architecture-suffixed intermediate tag; publish-manifest
  # (below) combines the two into the real, multi-arch tags a consumer
  # actually uses.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            flake_attr: oci-image
            internal_name: workspaces-host
            repo_suffix: ""
          - runner: ubuntu-24.04-arm
            arch: arm64
            flake_attr: oci-image
            internal_name: workspaces-host
            repo_suffix: ""
          - runner: ubuntu-latest
            arch: amd64
            flake_attr: oci-image-press
            internal_name: workspaces-host-press
            repo_suffix: "-press"
          - runner: ubuntu-24.04-arm
            arch: arm64
            flake_attr: oci-image-press
            internal_name: workspaces-host-press
            repo_suffix: "-press"
          - runner: ubuntu-latest
            arch: amd64
            flake_attr: oci-image-rust
            internal_name: workspaces-host-rust
            repo_suffix: "-rust"
          - runner: ubuntu-24.04-arm
            arch: arm64
            flake_attr: oci-image-rust
            internal_name: workspaces-host-rust
            repo_suffix: "-rust"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the OCI image
        run: nix build .#${{ matrix.flake_attr }}

      - name: Load into the local Docker daemon
        run: docker load < result

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push this architecture's image
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${{ matrix.repo_suffix }}"
          sha_short="$(git rev-parse --short HEAD)"
          docker tag "${{ matrix.internal_name }}:latest" "$image:sha-$sha_short-${{ matrix.arch }}"
          docker push "$image:sha-$sha_short-${{ matrix.arch }}"

  # One merge per image, after both its architectures have pushed:
  # `docker buildx imagetools create` builds a multi-arch manifest list
  # from the two intermediate tags and publishes it under the tags spec
  # 020 documents (`latest`, `sha-<short-sha>`) - the ones a consumer
  # actually pulls, correct on either architecture with no platform flag.
  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo_suffix: [ "", "-press", "-rust" ]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create and push the multi-arch manifest
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${{ matrix.repo_suffix }}"
          sha_short="$(git rev-parse --short HEAD)"
          docker buildx imagetools create \
            -t "$image:latest" \
            -t "$image:sha-$sha_short" \
            "$image:sha-$sha_short-amd64" \
            "$image:sha-$sha_short-arm64"
