name: Container Image

# Publishes the same OCI image `nix build .#oci-image` produces (spec 005,
# Constitution Principle IV: container parity, not a hand-maintained
# Dockerfile) to the GitHub Container Registry, so anyone - a human testing
# a change, or an AI agent spinning up a disposable sandbox - can `docker
# pull` this repository's exact closure instead of building it from source.
# See specs/020-public-container-image/spec.md.

on:
  push:
    branches: [main]
    paths:
      - "home/**"
      - "pkgs/**"
      - "oci/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/container-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the OCI image
        run: nix build .#oci-image

      - name: Load into the local Docker daemon
        run: docker load < result

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha_short="$(git rev-parse --short HEAD)"
          docker tag workspaces-host:latest "$image:latest"
          docker tag workspaces-host:latest "$image:sha-$sha_short"
          docker push "$image:latest"
          docker push "$image:sha-$sha_short"
