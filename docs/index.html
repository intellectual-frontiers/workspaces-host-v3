<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>workspaces-host-v3</title>
<meta name="description" content="Install, use, and understand workspaces-host-v3: a reproducible engineering sandbox built on Nix and home-manager." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9107;</text></svg>" />
<style>
/* workspaces-host-v3 documentation site. One HTML shell (nav, chrome,
   the router below); the content for every page is a plain Markdown
   file under content/<tier>/<page>.md, fetched and rendered at
   navigation time by vendor/marked.js. A second vendored library,
   vendor/mermaid.min.js, renders diagrams on the few pages that have
   one - it is loaded lazily, only when a page actually needs it (see
   ensureMermaidLoaded below), since it is far too large to ship on
   every page. Both are vendored (not loaded from a live CDN) so the
   site has no third-party dependency at request time. This means
   JavaScript is required to read any content (a deliberate tradeoff -
   see spec 018's Background for why). */

:root {
  --bg: #ffffff;
  --text: #1a1d21;
  --text-soft: #57606a;
  --accent: #0969da;
  --accent-soft: #eaf2fe;
  --border: #e7e9ec;
  --code-bg: #f6f8fa;
  --code-border: #e3e6ea;
  --nav-height: 60px;
  --tier-nav-height: 48px;
  --content-max: 780px;
  --sidebar-width: 230px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + var(--tier-nav-height) + 16px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

code,
pre,
kbd {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  font-size: 0.88em;
}

/* ---------- top nav (tier) ---------- */

.site-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--border);
}

.site-nav-inner {
  height: var(--nav-height);
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 24px;
  overflow-x: auto;
  white-space: nowrap;
}

.site-nav .brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  margin-right: 16px;
  font-size: 1.02em;
}

.site-nav .brand img {
  width: 28px;
  height: 28px;
  display: block;
}

.site-nav a.nav-link {
  color: var(--text-soft);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.94em;
  font-weight: 500;
}

.site-nav a.nav-link:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.site-nav a.nav-link.current {
  color: var(--accent);
  background: var(--accent-soft);
}

.site-nav .spacer {
  flex: 1;
}

.site-nav a.gh-link {
  color: var(--text-soft);
  text-decoration: none;
  font-size: 0.94em;
  font-weight: 500;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.site-nav a.gh-link:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ---------- page shell: hero + sidebar + content ---------- */

.page {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  gap: 48px;
  max-width: 1040px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.page.no-sidebar {
  grid-template-columns: 1fr;
}

.page-hero {
  max-width: 1040px;
  margin: 0 auto;
  padding: 56px 24px 16px;
}

.page-hero h1 {
  font-size: 2.1em;
  margin: 0 0 10px;
  letter-spacing: -0.02em;
}

.page-hero p.lede {
  color: var(--text-soft);
  font-size: 1.15em;
  max-width: 640px;
  margin: 0;
}

.mascot {
  display: block;
  max-width: 520px;
  width: 100%;
  height: auto;
  margin: 0 0 24px;
  border-radius: 12px;
}

.mascot-wide {
  max-width: 780px;
}

/* ---------- splash page ---------- */

#content.splash-content {
  max-width: none;
}

.splash-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 8px 0 40px;
}

.splash-btn {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 28px 26px;
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
}

.splash-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.splash-btn-title {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--text);
}

.splash-btn-desc {
  color: var(--text-soft);
  font-size: 0.96em;
  line-height: 1.5;
}

.splash-secondary {
  display: block;
  margin: 0 auto;
}

@media (max-width: 640px) {
  .splash-buttons {
    grid-template-columns: 1fr;
  }
}

.sidebar {
  position: sticky;
  top: calc(var(--nav-height) + 24px);
  align-self: start;
  max-height: calc(100vh - var(--nav-height) - 48px);
  overflow-y: auto;
}

.sidebar ul {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 2px solid var(--border);
}

.sidebar li {
  margin: 0;
}

.sidebar a {
  display: block;
  padding: 6px 0 6px 14px;
  margin-left: -2px;
  border-left: 2px solid transparent;
  color: var(--text-soft);
  text-decoration: none;
  font-size: 0.92em;
}

.sidebar a:hover {
  color: var(--accent);
  border-left-color: var(--accent);
}

.sidebar a.current-page {
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}

.sidebar .sub {
  padding-left: 28px;
  font-size: 0.88em;
}

.sidebar .sub-heading-3 {
  padding-left: 42px;
}

main.content {
  min-width: 0;
  max-width: var(--content-max);
}

main.content h2 {
  font-size: 1.5em;
  margin: 2.4em 0 0.6em;
  padding-top: 0.2em;
  letter-spacing: -0.01em;
}

main.content h2:first-of-type {
  margin-top: 0;
}

main.content h3 {
  font-size: 1.15em;
  margin: 1.8em 0 0.5em;
}

main.content p {
  margin: 0.9em 0;
}

main.content ul,
main.content ol {
  padding-left: 1.4em;
}

main.content li {
  margin: 0.4em 0;
}

main.content a {
  color: var(--accent);
}

main.content strong {
  font-weight: 600;
}

.content-loading {
  color: var(--text-soft);
  padding: 8px 0 40px;
}

.content-error {
  color: #b42318;
  padding: 8px 0 40px;
}

/* ---------- prev/next pager ---------- */

.page-pager {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 3em 0 1em;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.pager-link {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  min-width: 0;
}

.pager-link.pager-empty {
  border: none;
}

.pager-next {
  text-align: right;
  align-items: flex-end;
}

.pager-link:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.pager-label {
  font-size: 0.78em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-soft);
}

.pager-title {
  font-size: 1.02em;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

@media (max-width: 520px) {
  .page-pager {
    grid-template-columns: 1fr;
  }

  .pager-next {
    text-align: left;
    align-items: flex-start;
  }
}

/* ---------- code blocks ---------- */

.code-block {
  position: relative;
  margin: 1.1em 0;
}

pre {
  margin: 0;
  padding: 14px 16px;
  padding-right: 64px;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 8px;
  overflow-x: auto;
}

pre code {
  background: none;
  padding: 0;
  color: var(--text);
}

:not(pre) > code {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 4px;
  padding: 0.1em 0.4em;
  overflow-wrap: anywhere;
}

.code-block .copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  font: inherit;
  font-size: 0.75em;
  font-weight: 600;
  color: var(--text-soft);
  background: var(--bg);
  border: 1px solid var(--code-border);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
}

.code-block .copy-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

/* ---------- Mermaid diagrams ---------- */

.mermaid {
  margin: 1.4em 0;
  padding: 16px;
  border: 1px solid var(--code-border);
  border-radius: 8px;
  background: var(--code-bg);
  overflow-x: auto;
  text-align: center;
}

.mermaid svg {
  max-width: 100%;
  height: auto;
}

/* ---------- callouts (from > [!TIP] / [!NOTE] / [!WARNING] etc.) ---------- */

.callout {
  margin: 1.4em 0;
  padding: 14px 18px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 8px 8px 0;
}

.callout p {
  margin: 0.4em 0;
}

.callout.note {
  border-left-color: #9a6700;
  background: #fff8e6;
}

/* ---------- tables ---------- */

table {
  border-collapse: collapse;
  width: 100%;
  margin: 1.2em 0;
  font-size: 0.95em;
}

th,
td {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

th {
  color: var(--text-soft);
  font-weight: 600;
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* ---------- footer ---------- */

footer.site-footer {
  border-top: 1px solid var(--border);
  padding: 28px 24px 48px;
  text-align: center;
  color: var(--text-soft);
  font-size: 0.88em;
}

footer.site-footer a {
  color: var(--text-soft);
}

/* ---------- responsive ---------- */

@media (max-width: 840px) {
  .page {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 24px 18px 60px;
  }

  .sidebar {
    position: static;
    max-height: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 6px;
  }

  .sidebar ul {
    border-left: none;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
  }

  .sidebar li {
    display: inline-block;
  }

  .sidebar a {
    padding: 4px 0;
    border-left: none;
  }

  .sidebar a.current-page {
    border-left: none;
  }

  .sidebar .sub,
  .sidebar .sub-heading-3 {
    padding-left: 0;
  }

  .page-hero {
    padding: 36px 18px 8px;
  }

  .page-hero h1 {
    font-size: 1.7em;
  }
}

@media (max-width: 640px) {
  .site-nav {
    position: static;
  }

  .site-nav-inner {
    height: auto;
    flex-wrap: wrap;
    white-space: normal;
    overflow-x: visible;
    row-gap: 4px;
    padding: 10px 16px;
  }

  .site-nav .brand {
    margin-right: 8px;
  }

  .site-nav .spacer {
    flex-basis: 100%;
    height: 0;
  }

  .sidebar {
    top: 0;
  }
}
</style>
</head>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="brand" href="#home"><img src="logo.png" alt="" width="128" height="128">Workspaces Host</a>
    <a class="nav-link" data-tier="getting-started" href="#getting-started/install">Getting Started</a>

</div>

<footer class="site-footer">
  <p><a href="https://github.com/intellectual-frontiers/workspaces-host-v3">intellectual-frontiers/workspaces-host-v3</a> &middot; MIT License</p>
</footer>

<script src="vendor/marked.js"></script>
<script>
(function () {
  "use strict";

  // One entry per top-nav tier. Each page's `file` is fetched and
  // rendered with marked (vendor/marked.js) the first time it's
  // visited, then cached in memory for the rest of the session - no
  // build step, no static-site generator, just fetch + render at
  // navigation time.
  var MANIFEST = {
    "getting-started": {
      title: "Getting Started",
      lede: "Pick your platform. Run the commands. You'll have a working shell in a few minutes.",
      mascot: null,
      pages: [
        { slug: "install", title: "Install", file: "content/getting-started/install.md" },
        { slug: "first-day", title: "Verify it worked & your first day", file: "content/getting-started/first-day.md" }
      ]
    },
    "day-to-day": {
      title: "Day to Day",
      lede: "Already installed? Here's what you'll actually reach for, day to day.",
      mascot: null,
      pages: [
        { slug: "personas", title: "Combine personas for your role", file: "content/day-to-day/personas.md" },
        { slug: "credentials", title: "Authenticate & manage credentials", file: "content/day-to-day/credentials.md" },
        { slug: "repos", title: "Work across multiple git hosts", file: "content/day-to-day/repos.md" },
        { slug: "sync-recover", title: "Stay in sync & recover", file: "content/day-to-day/sync-recover.md" },
        { slug: "ai-agents", title: "Use AI coding agents safely", file: "content/day-to-day/ai-agents.md" },
        { slug: "everyday-tools", title: "Everyday tools", file: "content/day-to-day/everyday-tools.md" }
      ]
    },
    "going-further": {
      title: "Going Further",
      lede: "A light number of real advanced use cases, once the basics are second nature.",
      mascot: null,
      pages: [
        { slug: "local-nix", title: "Personalize with local.nix", file: "content/going-further/local-nix.md" },
        { slug: "add-a-tool-or-persona", title: "Add a tool or write a new persona", file: "content/going-further/add-a-tool-or-persona.md" },
        { slug: "team-secrets", title: "Team secrets with sops", file: "content/going-further/team-secrets.md" },
        { slug: "container-ci", title: "Container & CI parity", file: "content/going-further/container-ci.md" },
        { slug: "extend-with-ai", title: "Extend the repo with an AI agent", file: "content/going-further/extend-with-ai.md" },
        { slug: "architecture", title: "How it's built", file: "content/going-further/architecture.md" }
      ]
    },
    "faq": {
      title: "FAQ",
      lede: "Why this repository works the way it does, and what it grew out of.",
      mascot: null,
      pages: [
        { slug: "faq", title: "FAQ", file: "content/faq/faq.md" }
      ]
    }
  };

  var TIER_ORDER = ["getting-started", "day-to-day", "going-further", "faq"];
  var contentCache = {};
  var currentTier = null;

  // The splash page (empty hash, or "#home"): the mascot's hero
  // illustration plus one big button per tier, nothing else - the
  // large graphics live only here now, so every content page stays
  // lean. Each button's target is that tier's own first page.
  var HOME_LINKS = [
    { tierId: "getting-started", desc: "Install and get a working shell in a few minutes." },
    { tierId: "day-to-day", desc: "Personas, credentials, repos, and everything you'll reach for daily." },
    { tierId: "going-further", desc: "A light number of real advanced use cases, once the basics are second nature." },
    { tierId: "faq", desc: "Why this repository works the way it does, and what it grew out of." }
  ];

  function renderHomePage() {
    currentTier = null;

    document.querySelectorAll(".nav-link").forEach(function (a) {
      a.classList.remove("current");
    });

    var hero = document.getElementById("page-hero");
    hero.innerHTML =
      '<img class="mascot" src="mascot.jpg" alt="Workspaces Host mascot: a Clydesdale draft horse pulling a cart loaded with CODE, CONFIG, and TOOLS crates, captioned \'Same reproducible workspace everywhere.\'" width="900" height="688">' +
      "<h1>Workspaces Host</h1>" +
      '<p class="lede">Same reproducible workspace everywhere. Pick where to start.</p>';

    document.querySelector(".page").classList.add("no-sidebar");
    document.getElementById("sidebar").innerHTML = "";

    var content = document.getElementById("content");
    content.classList.add("splash-content");
    var html = '<div class="splash-buttons">';
    HOME_LINKS.forEach(function (link) {
      var tier = MANIFEST[link.tierId];
      var firstPage = tier.pages[0];
      html +=
        '<a class="splash-btn" href="#' + link.tierId + "/" + firstPage.slug + '">' +
        '<span class="splash-btn-title">' + tier.title + "</span>" +
        '<span class="splash-btn-desc">' + link.desc + "</span>" +
        "</a>";
    });
    html += "</div>";
    html +=
      '<img class="mascot mascot-wide splash-secondary" src="mascot-workflows.jpg" alt="Workhorse in Action: the mascot horse illustrated across eight everyday tasks - Develop, Explore, Guide, Automate, Recharge, Adapt, Stay Secure, and Go Further - captioned \'Different tasks. Same reliable companion.\'" width="1000" height="485">';
    content.innerHTML = html;

    document.title = "Workspaces Host";
    window.scrollTo(0, 0);
  }

  function findPage(tierId, pageSlug) {
    var tier = MANIFEST[tierId];
    if (!tier) return null;
    for (var i = 0; i < tier.pages.length; i++) {
      if (tier.pages[i].slug === pageSlug) return tier.pages[i];
    }
    return null;
  }

  // Every page across every tier, in nav order - the site's own
  // "book" order, so a reader can move linearly front to back with
  // the pager at the bottom of each page instead of only jumping
  // around via the sidebar/nav.
  function flattenedPages() {
    var flat = [];
    TIER_ORDER.forEach(function (tierId) {
      var tier = MANIFEST[tierId];
      if (!tier) return;
      tier.pages.forEach(function (p) {
        flat.push({ tierId: tierId, tierTitle: tier.title, slug: p.slug, title: p.title });
      });
    });
    return flat;
  }

  function renderPager(tierId, pageSlug) {
    var flat = flattenedPages();
    var idx = -1;
    for (var i = 0; i < flat.length; i++) {
      if (flat[i].tierId === tierId && flat[i].slug === pageSlug) {
        idx = i;
        break;
      }
    }
    if (idx === -1) return "";
    var prev = idx > 0 ? flat[idx - 1] : null;
    var next = idx < flat.length - 1 ? flat[idx + 1] : null;
    var html = '<nav class="page-pager" aria-label="Page navigation">';
    if (prev) {
      html += '<a class="pager-link pager-prev" href="#' + prev.tierId + "/" + prev.slug + '"><span class="pager-label">&larr; Previous</span><span class="pager-title">' + prev.title + "</span></a>";
    } else {
      html += '<span class="pager-link pager-empty"></span>';
    }
    if (next) {
      html += '<a class="pager-link pager-next" href="#' + next.tierId + "/" + next.slug + '"><span class="pager-label">Next &rarr;</span><span class="pager-title">' + next.title + "</span></a>";
    } else {
      html += '<span class="pager-link pager-empty"></span>';
    }
    html += "</nav>";
    return html;
  }

  function parseHash() {
    var raw = location.hash.replace(/^#/, "");
    if (raw === "" || raw === "home") {
      return { isHome: true };
    }
    var parts = raw.split("/");
    var tierId = parts[0] || "";
    var pageSlug = parts[1] || "";
    var headingSlug = parts[2] || "";
    if (!MANIFEST[tierId] || !findPage(tierId, pageSlug)) {
      // An unrecognized hash (a typo, a stale bookmark) falls back to
      // the splash page - the site's own front door - rather than
      // guessing which tier the reader meant.
      return { isHome: true };
    }
    return { tierId: tierId, pageSlug: pageSlug, headingSlug: headingSlug, isHome: false };
  }

  // GitHub-style alert blockquotes: `> [!TIP] ...` / `[!NOTE]` /
  // `[!WARNING]` / `[!IMPORTANT]` / `[!CAUTION]`. marked renders these
  // as plain <blockquote><p>[!TIP]\ntext</p></blockquote>; this walks
  // the rendered DOM afterward and turns matching ones into the same
  // .callout styling every page already uses, so the raw .md source
  // stays plain, readable Markdown (and still renders sensibly on
  // GitHub itself) with no custom marked extension required.
  var ALERT_RE = /^\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\]\s*/;
  function applyCallouts(root) {
    var quotes = root.querySelectorAll("blockquote");
    quotes.forEach(function (bq) {
      var firstP = bq.querySelector("p");
      if (!firstP) return;
      var match = ALERT_RE.exec(firstP.textContent);
      if (!match) return;
      firstP.innerHTML = firstP.innerHTML.replace(ALERT_RE, "");
      var kind = match[1];
      var div = document.createElement("div");
      div.className = "callout" + (kind === "NOTE" || kind === "TIP" ? "" : " note");
      while (bq.firstChild) div.appendChild(bq.firstChild);
      bq.replaceWith(div);
    });
  }

  // Assign a slug id to every h2/h3 and build the "on this page" list
  // from them - generated from the actual rendered headings, so a
  // heading edit can never drift out of sync with a hand-maintained
  // sidebar the way the old per-section HTML could. A heading may end
  // in `{#exact-id}` (Pandoc/kramdown-style header attribute) to pin a
  // stable, short cross-reference target independent of its wording;
  // otherwise the id is auto-slugified from the heading text.
  var EXPLICIT_ID_RE = /\s*\{#([a-z0-9-]+)\}\s*$/i;
  function slugify(text) {
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, "")
      .trim()
      .replace(/\s+/g, "-");
  }

  function buildPageToc(root) {
    var used = {};
    var toc = [];
    root.querySelectorAll("h2, h3").forEach(function (h) {
      var explicit = EXPLICIT_ID_RE.exec(h.textContent);
      var base;
      if (explicit) {
        base = explicit[1];
        h.innerHTML = h.innerHTML.replace(EXPLICIT_ID_RE, "");
      } else {
        base = slugify(h.textContent);
      }
      var id = base;
      var n = 2;
      while (used[id]) {
        id = base + "-" + n;
        n++;
      }
      used[id] = true;
      h.id = id;
      toc.push({ id: id, text: h.textContent, level: h.tagName === "H2" ? 2 : 3 });
    });
    return toc;
  }

  // One flat nav list per tier: every page, and - directly under
  // whichever page is current - that page's own headings nested in as
  // sub-items. No "Pages"/"On this page" labels: the nesting itself is
  // what tells a reader which links are sibling pages and which are
  // places within the page they're already on.
  function renderSidebar(tierId, pageSlug, pageToc) {
    var tier = MANIFEST[tierId];
    var sidebar = document.getElementById("sidebar");
    var html = "<ul>";
    tier.pages.forEach(function (p) {
      var isCurrent = p.slug === pageSlug;
      var cls = isCurrent ? ' class="current-page"' : "";
      html += '<li><a' + cls + ' href="#' + tierId + "/" + p.slug + '">' + p.title + "</a></li>";
      if (isCurrent) {
        pageToc.forEach(function (h) {
          html += '<li class="sub' + (h.level === 3 ? " sub-heading-3" : "") + '"><a href="#' + tierId + "/" + pageSlug + "/" + h.id + '">' + h.text + "</a></li>";
        });
      }
    });
    html += "</ul>";
    sidebar.innerHTML = html;
  }

  function renderHero(tierId) {
    if (tierId === currentTier) return;
    currentTier = tierId;
    var tier = MANIFEST[tierId];
    var hero = document.getElementById("page-hero");
    var html = "";
    if (tier.mascot) {
      var m = tier.mascot;
      html += '<img class="mascot' + (m.wide ? " mascot-wide" : "") + '" src="' + m.src + '" alt="' + m.alt.replace(/"/g, "&quot;") + '" width="' + m.width + '" height="' + m.height + '">';
    }
    html += "<h1>" + tier.title + "</h1>";
    html += '<p class="lede">' + tier.lede + "</p>";
    hero.innerHTML = html;
  }

  // vendor/mermaid.min.js is ~5.5MB - real, since it bundles its own
  // layout engines, but far too much to load on every page when most
  // pages have no diagram at all. Loaded once, lazily, only the first
  // time a page actually needs it; cached after that for the rest of
  // the session.
  var mermaidLoadPromise = null;
  function ensureMermaidLoaded() {
    if (!mermaidLoadPromise) {
      mermaidLoadPromise = new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = "vendor/mermaid.min.js";
        script.onload = function () {
          mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });
          resolve();
        };
        script.onerror = function () {
          mermaidLoadPromise = null;
          reject(new Error("could not load vendor/mermaid.min.js"));
        };
        document.head.appendChild(script);
      });
    }
    return mermaidLoadPromise;
  }

  // A fenced ```mermaid block renders as <pre><code
  // class="language-mermaid">...</code></pre>; mermaid itself expects
  // a plain <div class="mermaid"> holding the raw diagram source, so
  // this swaps the two before handing the page's diagrams to
  // mermaid.run(). Skipped entirely (no library ever loads) on a page
  // with no diagram.
  function renderMermaidBlocks(root) {
    var blocks = root.querySelectorAll("code.language-mermaid");
    if (!blocks.length) return;
    var diagrams = [];
    blocks.forEach(function (code) {
      var pre = code.closest("pre");
      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      pre.replaceWith(div);
      diagrams.push(div);
    });
    ensureMermaidLoaded()
      .then(function () {
        return mermaid.run({ nodes: diagrams });
      })
      .catch(function (err) {
        diagrams.forEach(function (d) {
          d.outerHTML = '<p class="content-error">Diagram failed to render (' + err.message + ").</p>";
        });
      });
  }

  // Re-run on every render: wraps each <pre> in a .code-block and adds
  // a Copy button. Purely additive - every block is already plain,
  // selectable text without it.
  function enhanceCodeBlocks(root) {
    root.querySelectorAll("pre").forEach(function (pre) {
      var wrapper = document.createElement("div");
      wrapper.className = "code-block";
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);

      var btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.type = "button";
      btn.textContent = "Copy";
      wrapper.appendChild(btn);

      btn.addEventListener("click", function () {
        var text = pre.textContent.replace(/^\$ /gm, "");
        navigator.clipboard.writeText(text).then(
          function () {
            btn.textContent = "Copied";
            setTimeout(function () { btn.textContent = "Copy"; }, 1500);
          },
          function () {
            btn.textContent = "Select + Ctrl/Cmd-C";
            setTimeout(function () { btn.textContent = "Copy"; }, 2000);
          }
        );
      });
    });
  }

  function fetchPage(page) {
    if (contentCache[page.file]) {
      return Promise.resolve(contentCache[page.file]);
    }
    return fetch(page.file)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + page.file);
        return res.text();
      })
      .then(function (text) {
        contentCache[page.file] = text;
        return text;
      });
  }

  function render() {
    var loc = parseHash();

    if (loc.isHome) {
      renderHomePage();
      return;
    }

    // Coming from the splash page (or back to a real page after it):
    // undo its single-column, no-large-graphic layout.
    document.querySelector(".page").classList.remove("no-sidebar");
    document.getElementById("content").classList.remove("splash-content");

    var tier = MANIFEST[loc.tierId];
    var page = findPage(loc.tierId, loc.pageSlug);

    document.querySelectorAll(".nav-link").forEach(function (a) {
      a.classList.toggle("current", a.dataset.tier === loc.tierId);
    });

    renderHero(loc.tierId);

    var content = document.getElementById("content");
    content.innerHTML = '<p class="content-loading">Loading&hellip;</p>';

    fetchPage(page)
      .then(function (markdown) {
        content.innerHTML = marked.parse(markdown);
        applyCallouts(content);
        var toc = buildPageToc(content);
        renderMermaidBlocks(content);
        enhanceCodeBlocks(content);
        content.insertAdjacentHTML("beforeend", renderPager(loc.tierId, loc.pageSlug));
        renderSidebar(loc.tierId, loc.pageSlug, toc);
        document.title = page.title + " | " + tier.title + " | workspaces-host-v3";
        if (loc.headingSlug) {
          var target = document.getElementById(loc.headingSlug);
          if (target) target.scrollIntoView();
        } else {
          window.scrollTo(0, 0);
        }
      })
      .catch(function (err) {
        content.innerHTML = '<p class="content-error">Could not load this page (' + err.message + '). <a href="https://github.com/intellectual-frontiers/workspaces-host-v3/tree/main/docs/content">Read it directly on GitHub</a> instead.</p>';
      });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
